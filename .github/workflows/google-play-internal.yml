name: SYSTEM Google Play Internal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-submit:
    name: Build AAB and publish to Google Play Internal
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/third_party/music/
          sparse-checkout-cone-mode: false

      - name: Require Expo token
        shell: bash
        run: |
          if [ -z "${EXPO_TOKEN}" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Validate project
        run: |
          npm run typecheck
          node src/system2/tests/ota-update.contract.test.cjs
          node scripts/check-play-readiness.mjs

      - name: Build and submit to Google Play Internal
        shell: bash
        run: |
          npx --yes eas-cli@latest build             --platform android             --profile play-internal             --auto-submit-with-profile play-internal             --non-interactive             --wait

      - name: Summary
        shell: bash
        run: |
          {
            echo "## SYSTEM Google Play Internal"
            echo ""
            echo "- Format: AAB"
            echo "- Track: internal"
            echo "- OTA channel: preview"
            echo "- Runtime policy: appVersion"
            echo "- Install path: Google Play"
          } >> "$GITHUB_STEP_SUMMARY"
