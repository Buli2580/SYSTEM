name: SYSTEM Nightly AI Build

on:
  workflow_dispatch:
  push:
    branches:
      - integration/system-canonical
      - "feature/**"
  pull_request:
    branches:
      - integration/system-canonical

permissions:
  contents: read

concurrency:
  group: system-nightly-ai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate SYSTEM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Expo config
        run: npx expo config --type public > /tmp/expo-config.txt

      - name: Google Play readiness
        run: node scripts/check-play-readiness.mjs

      - name: TypeScript
        run: npm run typecheck

      - name: SYSTEM tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(src/system2/tests/*.test.cjs)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No SYSTEM test files found."
            exit 1
          fi
          node --test "${tests[@]}"

      - name: Cloud tests
        run: |
          npm ci --prefix supabase/tests --ignore-scripts --no-audit --no-fund
          npm test --prefix supabase/tests

      - name: Legacy server syntax
        run: node --check server/server.js

      - name: Diff check
        run: git diff --check

  build-apk:
    name: Build Android ARM64 APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.workers.max=2 -Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Do not persist the Gradle user-home cache on hosted runners here.
      # Native Expo/RN builds can exceed the runner disk while setup-gradle
      # archives ~/.gradle after a successful APK build. The Gradle wrapper
      # and npm cache are sufficient for this correctness-oriented nightly.
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Limit APK to ARM64
        shell: bash
        run: |
          if grep -q '^reactNativeArchitectures=' android/gradle.properties; then
            sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/' android/gradle.properties
          else
            echo 'reactNativeArchitectures=arm64-v8a' >> android/gradle.properties
          fi
          grep '^reactNativeArchitectures=' android/gradle.properties

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --build-cache \
            --parallel \
            --console=plain \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/SYSTEM-NIGHTLY-${GITHUB_SHA::8}.apk
          sha256sum dist/SYSTEM-NIGHTLY-${GITHUB_SHA::8}.apk | tee dist/SYSTEM-NIGHTLY-${GITHUB_SHA::8}.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-NIGHTLY-${{ github.sha }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## SYSTEM Nightly AI Build"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Validation: PASS"
            echo "- Android APK: PASS"
            echo "- Architecture: arm64-v8a"
            echo "- Artifact: SYSTEM-NIGHTLY-${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
