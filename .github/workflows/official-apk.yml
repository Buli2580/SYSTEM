name: SYSTEM Official APK
on:
  pull_request:
    branches:
      - integration/system-evening-build
  workflow_dispatch:
  push:
    branches:
      - integration/system-evening-build
permissions:
  contents: read
concurrency:
  group: system-official-apk
  cancel-in-progress: false
jobs:
  release-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test release safeguards without signing secrets
        run: |
          node --test scripts/apk-provenance.test.cjs \
            scripts/tests/verify-official-artifact.test.cjs \
            scripts/tests/install-verified-apk.test.cjs \
            scripts/tests/verify-build-source.test.cjs \
            scripts/tests/release-verified-apk.test.cjs \
            scripts/tests/check-installed-apk.test.cjs
      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck app before release
        run: npm run typecheck
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      SYSTEM_ANDROID_KEY_ALIAS: ${{ secrets.SYSTEM_ANDROID_KEY_ALIAS }}
      SYSTEM_ANDROID_STORE_PASSWORD: ${{ secrets.SYSTEM_ANDROID_STORE_PASSWORD }}
      SYSTEM_ANDROID_KEY_PASSWORD: ${{ secrets.SYSTEM_ANDROID_KEY_PASSWORD }}
      SYSTEM_ANDROID_CERT_SHA256: ${{ secrets.SYSTEM_ANDROID_CERT_SHA256 }}
    steps:
      - name: Require official source
        env:
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          test "$SOURCE_REF" = 'refs/heads/integration/system-evening-build'
          test "$SOURCE_REPO" = 'Buli2580/SYSTEM'
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Release safety tests (no signing secrets needed)
        run: |
          node --test scripts/apk-provenance.test.cjs \
            scripts/tests/verify-official-artifact.test.cjs \
            scripts/tests/install-verified-apk.test.cjs \
            scripts/tests/verify-build-source.test.cjs \
            scripts/tests/release-verified-apk.test.cjs \
            scripts/tests/check-installed-apk.test.cjs
      - name: Load existing signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SYSTEM_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing existing application signing key'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/system-signing.jks"
          echo "SYSTEM_ANDROID_KEYSTORE=$RUNNER_TEMP/system-signing.jks" >> "$GITHUB_ENV"
      - name: Provenance tests
        run: node --test scripts/apk-provenance.test.cjs
      - name: Build and verify exact commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/release-verified-apk.cjs "$EXPECTED_SHA" integration/system-evening-build
      - uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/official/
          if-no-files-found: error
          retention-days: 14
