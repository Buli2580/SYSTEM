name: Configure OTA Dependency

on:
  push:
    branches:
      - feature/presentation-engine-2.0
    paths:
      - .github/workflows/configure-ota-dependency.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/presentation-engine-2.0
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/third_party/music/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install current dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Expo Updates
        run: npx expo install expo-updates

      - name: Validate package lock
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Commit dependency
        shell: bash
        run: |
          git config user.name "SYSTEM OTA Setup"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "expo-updates already configured"
            exit 0
          fi
          git commit -m "ota: install expo-updates"
          git push origin HEAD:feature/presentation-engine-2.0
