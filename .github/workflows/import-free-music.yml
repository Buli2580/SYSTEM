name: Import Free Music Library

on:
  push:
    branches:
      - feature/presentation-engine-2.0
    paths:
      - .github/workflows/import-free-music.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-music:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/presentation-engine-2.0
          fetch-depth: 1

      - name: Download and unpack additional free music packs
        shell: bash
        run: |
          set -euo pipefail
          ROOT="third_party/music"
          TMP="$RUNNER_TEMP/system-free-music"
          mkdir -p "$ROOT" "$TMP"

          has_audio () {
            local out="$1"
            [ -d "$out" ] && find "$out" -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.opus' \) -print -quit | grep -q .
          }

          fetch_zip_optional () {
            local url="$1"
            local zip="$2"
            local out="$3"

            if has_audio "$out"; then
              echo "Skipping existing pack: $out"
              return 0
            fi

            echo "Downloading $url"
            if ! curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 900 "$url" -o "$TMP/$zip"; then
              echo "::warning::Could not download $url"
              rm -f "$TMP/$zip"
              return 0
            fi

            mkdir -p "$out"
            if ! python -c 'import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])' "$TMP/$zip" "$out"; then
              echo "::warning::Could not unpack $zip"
              rm -rf "$out"
            fi
            rm -f "$TMP/$zip"
          }

          fetch_7z_optional () {
            local url="$1"
            local archive="$2"
            local out="$3"

            if has_audio "$out"; then
              echo "Skipping existing pack: $out"
              return 0
            fi

            echo "Downloading $url"
            if ! curl -fL --retry 4 --retry-delay 3 --connect-timeout 30 --max-time 900 "$url" -o "$TMP/$archive"; then
              echo "::warning::Could not download $url"
              rm -f "$TMP/$archive"
              return 0
            fi

            if ! command -v 7z >/dev/null 2>&1; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq p7zip-full
            fi

            mkdir -p "$out"
            if ! 7z x -y "$TMP/$archive" -o"$out" >/dev/null; then
              echo "::warning::Could not unpack $archive"
              rm -rf "$out"
            fi
            rm -f "$TMP/$archive"
          }

          # CC0 — Monster RPG 2: 42 original OGG soundtrack tracks.
          fetch_7z_optional             "https://opengameart.org/sites/default/files/Monster%20RPG%202%20OGG%20Music%20-%20Revised.7z"             "monster-rpg-2.7z"             "$ROOT/cc0/monster-rpg-2"

          # CC0 — 16 procedural RPG-like OGG tracks.
          fetch_zip_optional             "https://opengameart.org/sites/default/files/RPGMusic1ogg.zip"             "RPGMusic1ogg.zip"             "$ROOT/cc0/procedural-rpg-music-16"

          # CC0 — Juhani Junkala / SubspaceAudio JRPG series.
          fetch_zip_optional             "https://opengameart.org/sites/default/files/JRPG%20Music%20Pack%20%231%20%5BExploration%5D%20by%20Juhani%20Junkala.zip"             "jrpg-pack-1-exploration.zip"             "$ROOT/cc0/juhani-junkala-jrpg-pack-1-exploration"

          fetch_zip_optional             "https://opengameart.org/sites/default/files/JRPG%20Music%20Pack%20%232%20%5BTowns%5D%20by%20Juhani%20Junkala.zip"             "jrpg-pack-2-towns.zip"             "$ROOT/cc0/juhani-junkala-jrpg-pack-2-towns"

          fetch_zip_optional             "https://opengameart.org/sites/default/files/JRPG%20Music%20Pack%20%233%20%5BEvil%5D%20by%20Juhani%20Junkala.zip"             "jrpg-pack-3-evil.zip"             "$ROOT/cc0/juhani-junkala-jrpg-pack-3-evil"

          fetch_zip_optional             "https://opengameart.org/sites/default/files/JRPG%20Music%20Pack%20%234%20%5BCalm%5D%20by%20Juhani%20Junkala.zip"             "jrpg-pack-4-calm.zip"             "$ROOT/cc0/juhani-junkala-jrpg-pack-4-calm"

          # CC0 — 10 modern chiptune tracks.
          fetch_zip_optional             "https://opengameart.org/sites/default/files/10_track_demo_-_ogg.zip"             "10-track-modern-chiptune.zip"             "$ROOT/cc0/modern-chiptune-10"

          # CC0 — horror / game-over collection.
          fetch_zip_optional             "https://opengameart.org/sites/default/files/game_over.zip"             "game-over-collection.zip"             "$ROOT/cc0/game-over-collection"

          # CC0 / public domain — Golgotha soundtrack.
          fetch_zip_optional             "https://opengameart.org/sites/default/files/golgotha_music.zip"             "golgotha-music.zip"             "$ROOT/cc0/golgotha-game-engine-soundtrack"

          # Keep the source library compact: compressed playback formats only.
          find "$ROOT" -type f \( -iname '*.wav' -o -iname '*.mid' -o -iname '*.midi' -o -iname '*.ftm' -o -iname '*.flac' -o -iname '*.zip' -o -iname '*.7z' -o -name '.DS_Store' -o -name 'Thumbs.db' \) -delete

      - name: Update license manifest
        shell: bash
        run: |
          cat > third_party/music/LICENSES.md <<'EOF'
          # SYSTEM — Third-Party Music Library

          These files are stored as a source library. They are not automatically included in the app bundle.
          Before moving any track into active app assets, preserve the attribution required by its license.

          ## Alexander Ehlers — Free Music Pack
          - Source: https://opengameart.org/node/15828
          - License: CC0
          - Attribution required: No

          ## Komiku / Loyalty Freak Music — Helice Incredible Adventure
          - Source: https://opengameart.org/content/helice-incredible-adventure-fantasy-disco-rpg-battle-music-and-midi-files-pack
          - License: CC0
          - Attribution required: No
          - Author notice: Music written by Komiku

          ## Blake Speers / Volcano of Bears — Last Starlight: Paradise Dream
          - Source: https://opengameart.org/content/full-8-bit-jrpg-soundtrack-downloadable-and-editable-music-pack
          - License: CC BY 4.0
          - Attribution required: Yes

          ## Pudgyplatypus — Royalty Free Game Music Loops
          - Source: https://opengameart.org/content/royalty-free-game-music-loops
          - License: CC0
          - Attribution required: No

          ## drakzlin — Music Loops
          - Source: https://opengameart.org/content/music-loops-0
          - License: CC0
          - Attribution required: No

          ## Sparklin Labs / Superpowers — Music Asset Packs
          - Source: https://opengameart.org/content/superpowers-assets-music
          - License: CC0
          - Attribution required: No

          ## Juhani Junkala / SubspaceAudio — JRPG Pack 5 Action
          - Source: https://opengameart.org/content/jrpg-pack-5-action
          - License: CC0
          - Attribution required: No

          ## ietsu — A Journey's End
          - Source: https://opengameart.org/content/a-journeys-end
          - License: CC BY 3.0
          - Attribution required: Yes

          ## Monster RPG 2 soundtrack
          - Source: https://opengameart.org/node/12966
          - License: CC0
          - Attribution required: No
          - Note: the OpenGameArt archive excludes jungle_ambience because it was not original.

          ## messersm — 16 RPG-like procedural generated music tracks
          - Source: https://opengameart.org/content/16-rpg-like-procedural-generated-music-tracks
          - License: CC0
          - Attribution required: No

          ## Juhani Junkala / SubspaceAudio — JRPG Pack 1 Exploration
          - Source: https://opengameart.org/content/jrpg-pack-1-exploration
          - License: CC0
          - Attribution required: No

          ## Juhani Junkala / SubspaceAudio — JRPG Pack 2 Towns
          - Source: https://opengameart.org/content/jrpg-pack-2-towns
          - License: CC0
          - Attribution required: No

          ## Juhani Junkala / SubspaceAudio — JRPG Pack 3 Evil
          - Source: https://opengameart.org/content/jrpg-pack-3-evil
          - License: CC0
          - Attribution required: No

          ## Juhani Junkala / SubspaceAudio — JRPG Pack 4 Calm
          - Source: https://opengameart.org/content/jrpg-pack-4-calm
          - License: CC0
          - Attribution required: No

          ## IndieDevs — 10 Track Modern Chiptune Demo
          - Source: https://opengameart.org/content/10-track-modern-chiptune-demo
          - License: CC0
          - Attribution required: No

          ## Holizna — Game Over Collection
          - Source: https://opengameart.org/content/game-over-collection
          - License: CC0
          - Attribution required: No

          ## Crack.com / Golgotha Game Engine Soundtrack
          - Source: https://opengameart.org/content/golgotha-game-engine-soundtrack-pub-domain-by-crackcom
          - License: CC0 / public domain
          - Attribution required: No

          EOF

      - name: Inventory
        shell: bash
        run: |
          find third_party/music -type f | sort > third_party/music/FILES.txt
          echo "Tracks/files imported:"
          find third_party/music -type f | wc -l
          echo "Compressed audio files:"
          find third_party/music -type f \( -iname '*.ogg' -o -iname '*.mp3' -o -iname '*.opus' \) | wc -l
          du -sh third_party/music

      - name: Commit imported library
        shell: bash
        run: |
          git config user.name "SYSTEM Music Importer"
          git config user.email "actions@users.noreply.github.com"
          git add third_party/music
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "audio: import third free licensed music batch"
          git push origin HEAD:feature/presentation-engine-2.0
