name: SYSTEM CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript + gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Gameplay tests
        run: node --test src/system2/tests/gameplay.test.cjs
