name: SYSTEM CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - "agent/**"
      - "chore/**"

permissions:
  contents: read

jobs:
  validate:
    name: TypeScript + gameplay tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo config
        run: npx expo config --type public > /tmp/expo-config.txt

      - name: Google Play readiness
        run: node scripts/check-play-readiness.mjs

      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Gameplay tests
        run: node --test src/system2/tests/gameplay.test.cjs

      - name: Legacy server syntax
        run: node --check server/server.js

      - name: Diff check
        run: git diff --check
