name: SYSTEM TypeScript Validation

on:
  push:
    branches:
      - feature/home-3-world-scene
      - feature/pack1-inventory-social-loop
      - integration/system-unified-20260926
  pull_request:
    branches:
      - agent/release
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit --incremental false

      - name: Adaptive tests
        run: node --test src/system2/tests/adaptive.test.cjs
